<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <style>
    *{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;padding:20px 15px 85px;background:#0d1117;color:#fff}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.header h3{color:#ffb703}.badge{background:#ffd700;color:#000;padding:4px 10px;border-radius:15px;font-size:11px;font-weight:bold}.card,.box{background:#161b22;border-radius:16px;padding:18px;margin-bottom:15px;border:1px solid #29313d}.balance{text-align:center;background:linear-gradient(135deg,#1f2937,#111827);border-color:#72540b}.amount{font-size:36px;font-weight:bold;margin:8px}.progress{color:#fbbc05;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{text-align:center}.box h4{margin:0 0 4px;color:#34a853}.box span{font-size:11px;color:#8e9bae}.btn{width:100%;border:0;border-radius:14px;padding:15px;margin:6px 0;font-size:15px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.daily{background:#34a853;color:#fff}.watch{background:#e63946;color:#fff}.nav{position:fixed;bottom:0;left:0;right:0;background:#161b22;display:grid;grid-template-columns:repeat(4,1fr);padding:9px;z-index:10}.nav button{background:none;border:0;color:#fff;font-size:11px}.section{display:none}.active{display:block}select,input{width:100%;padding:12px;margin:8px 0 15px;background:#0d1117;color:#fff;border:1px solid #39414d;border-radius:8px}
  </style>
</head>
<body>
  <main id="home-section" class="section active">
    <div class="header"><h3 id="greeting">Premium Rewards</h3><span class="badge">VIP MEMBER</span></div>
    <div class="card balance"><small>TOTAL BALANCE POINTS</small><div class="amount" id="total-points">0</div><div class="progress">Bonus Progress: <span id="streak-count">0</span>/5</div></div>
    <div class="grid"><div class="box"><h4 id="ads-today-count">Unlimited</h4><span>Today's Ads</span></div><div class="box"><h4 id="user-id-display">000000</h4><span>User ID</span></div></div>
    <button class="btn daily" id="daily-bonus-button">CLAIM DAILY BONUS (+100 PTS)</button>
    <button class="btn watch" id="watch-ad-button">WATCH VIDEO (+10 PTS)</button>
    <p style="text-align:center;color:#8e9bae;font-size:11px">Ads are subject to the advertising provider's availability and policies.</p>
  </main>
  <main id="withdraw-section" class="section"><h3 style="text-align:center">Withdraw Rewards</h3><div class="card"><h4>Cashout Details</h4><select id="withdraw-method"><option value="bKash">bKash (5000 PTS = 50 BDT)</option><option value="Nagad">Nagad (5000 PTS = 50 BDT)</option><option value="Rocket">Rocket (5000 PTS = 50 BDT)</option><option value="Recharge">Mobile Recharge (2000 PTS = 20 BDT)</option></select><input id="withdraw-number" inputmode="numeric" placeholder="e.g. 01700000000"><button class="btn" style="background:#ffb703" onclick="requestWithdraw()">Submit Withdrawal Request</button></div></main>
  <nav class="nav"><button onclick="showSection('home-section')">Home</button><button onclick="showSection('withdraw-section')">Withdraw</button><button onclick="safeOpen('https://t.me/videoearningofficial')">Community</button><button onclick="safeOpen('https://t.me/Botbyadmin')">Support</button></nav>
  <script>
    const firebaseConfig={apiKey:'AIzaSyDYcO5Xfw4YNYwI21FCzxV7Tdh8VzQiZCM',authDomain:'video-earning-3b04a.firebaseapp.com',databaseURL:'https://video-earning-3b04a-default-rtdb.firebaseio.com',projectId:'video-earning-3b04a',appId:'1:367103251659:web:0cf417e8eea7df1bbef74e'};
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const database=firebase.database();
    const tg=window.Telegram?.WebApp||null;if(tg)try{tg.expand()}catch(e){}
    const user=tg?.initDataUnsafe?.user||{id:'1876755942',first_name:'User'};const userRef=database.ref('users/'+user.id);let currentPoints=0;
    const config={AD_REWARD:10,DAILY_REWARD:100,FB_LINK:'https://www.facebook.com/share/1CyuNukW4D/'};const originalOpen=window.open.bind(window);
    function safeOpen(url){try{return originalOpen(url,'_blank','noopener,noreferrer')}catch(e){window.location.href=url}}
    function notify(message){if(tg?.showAlert)tg.showAlert(message);else alert(message)}
    function today(){return new Date().toDateString()}
    userRef.on('value',snap=>{const d=snap.val()||{};currentPoints=Number(d.points)||0;document.getElementById('total-points').textContent=currentPoints;document.getElementById('streak-count').textContent=Number(d.streak)||0;document.getElementById('greeting').textContent='Hi, '+(user.first_name||'User');document.getElementById('user-id-display').textContent=user.id;document.getElementById('ads-today-count').textContent='Unlimited'});
    document.getElementById('daily-bonus-button').onclick=()=>userRef.once('value',snap=>{const d=snap.val()||{},t=today();if(d.lastDailyClaim===t)return notify('You have already claimed your daily bonus today.');safeOpen(config.FB_LINK);userRef.transaction(x=>{x=x||{points:0,streak:0};x.points=(x.points||0)+config.DAILY_REWARD;x.lastDailyClaim=t;return x},(e,ok)=>{if(ok)notify('Daily bonus claimed.')}});
    let adInProgress=false;
    document.getElementById('watch-ad-button').onclick=async()=>{if(adInProgress)return;adInProgress=true;const button=document.getElementById('watch-ad-button');button.disabled=true;try{if(typeof show_10678160!=='function')throw new Error('Ad provider unavailable');await show_10678160();giveReward();}catch(e){notify('এই মুহূর্তে বিজ্ঞাপন পাওয়া যাচ্ছে না। পরে আবার চেষ্টা করুন।')}finally{adInProgress=false;button.disabled=false}};
    function giveReward(){userRef.transaction(d=>{d=d||{points:0,streak:0};d.points=(d.points||0)+config.AD_REWARD;d.streak=(d.streak||0)+1;d.lastAdDate=today();d.adsToday=(d.adsToday||0)+1;return d},(e,ok)=>{if(ok)notify('Ad reward added.');else notify('Reward could not be saved.')})}
    function requestWithdraw(){const method=document.getElementById('withdraw-method').value,number=document.getElementById('withdraw-number').value.trim(),required=method==='Recharge'?2000:5000;if(!/^01\d{9}$/.test(number))return notify('Please enter a valid 11-digit mobile number.');if(currentPoints<required)return notify('Insufficient points.');userRef.transaction(d=>{if(!d||Number(d.points)<required)return;d.points-=required;return d},(e,ok)=>{if(!ok)return notify('Failed to process withdrawal.');database.ref('withdrawRequests').push({userId:user.id,name:user.first_name,method,accountNumber:number,pointsDeducted:required,status:'Pending',date:new Date().toISOString()});document.getElementById('withdraw-number').value='';notify('Withdrawal request submitted.')})}
    function showSection(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
  </script>
</body>
</html>
